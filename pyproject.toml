[project]
name = "trip-recap"
version = "0.2.0"
description = "Metadata-driven road-trip reconstruction and recap generation"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.141,<1",
    "fastapi-cli[standard]>=0.0.32",
    "pydantic>=2.12,<3",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "shapely>=2.1,<3",
    "playwright>=1.55,<2",
    "pillow>=11,<13",
    "pillow-heif>=0.18,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.fastapi]
entrypoint = "main:app"
